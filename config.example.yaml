# TIDD Experiment Configuration
# Copy this file to config.yaml and edit paths for your environment.

data:
  training_path: data/experiments/proof_of_concept/hawaii/train
  validation_path: data/experiments/proof_of_concept/hawaii/validation
  raw_paths:
    hawaii: data/hawaii
    chile: data/chile

output:
  save_path: output

model:
  architecture: resnet34
  batch_size: 256
  learning_rate: 0.0001
  max_epochs: 250

pipeline:
  encoder: gadf
  writer: pil
  window_size: 60
  resample_freq: 1min
  min_sequence_length: 100
  output_path: data/experiments
  workers: -1   # -1 = cpu_count - 1

experiment:
  name: my_experiment
  generate_data: false
  cuda_device: 0
