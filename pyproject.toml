[tool.poetry]
name = "tidd"
version = "0.2.0"
description = "Toolkit for Ionospheric Disturbance Detection (TIDD)"
authors = [
    "Valentino Constantinou <vconstan@jpl.nasa.gov>",
    "Hamlin Liu",
]
license = "Apache-2.0"
readme = "readme.md"
repository = "https://github.com/vc1492a/tidd"
keywords = ["ionosphere", "Earth", "atmosphere", "anomaly", "detection", "time-series", "deep", "learning"]
packages = [{include = "tidd"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
torch = ">=2.0"
torchvision = ">=0.15"
fastai = ">=2.7"
matplotlib = ">=3.7"
natsort = ">=8.0"
numpy = ">=1.24"
pandas = ">=2.0"
pyts = ">=0.13"
seaborn = ">=0.13"
scikit-learn = ">=1.3"
tqdm = ">=4.65"
pyyaml = ">=6.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-cov = ">=4.0"
ruff = ">=0.4"

[tool.poetry.group.notebooks.dependencies]
jupyter = ">=1.0"
plotly = ">=5.0"
pillow = ">=10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
